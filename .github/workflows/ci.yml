name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Keyed on the toolchain as well as Cargo.lock, and cleaned before saving.
      # The hand-rolled entries this replaces were keyed on Cargo.lock alone with
      # no restore-keys, and actions/cache never overwrites an existing key: the
      # target dir was written once and then frozen, while a lock bump threw the
      # whole thing away and paid for a cold build.
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
